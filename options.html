<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="optTitle">Boksa settings</title>
<style>
:root { color-scheme: light dark; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --card:#f6f8fa; --accent:#4f46e5; --bg:#fff; }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --card:#151b23; --accent:#a5a0ff; --bg:#0d1117; }
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; }
main { max-width:560px; margin:0 auto; padding:20px 20px 16px; }
h1 { font-size:18px; margin:0 0 16px; display:flex; align-items:center; gap:10px; }
h1 img { width:28px; height:28px; }
fieldset { border:1px solid var(--line); border-radius:10px; padding:6px 14px 10px; margin:0 0 14px; }
legend { font-weight:600; padding:0 6px; }
label { display:grid; grid-template-columns:20px 1fr; gap:0 8px; padding:8px 0; cursor:pointer; }
label + label { border-top:1px solid var(--line); }
input { margin:3px 0 0; accent-color:var(--accent); }
.name { font-weight:500; }
.hint { grid-column:2; color:var(--muted); font-size:13px; }
footer { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:4px; }
button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; }
button:hover { border-color:var(--accent); }
label:has(+ .tune) { padding-bottom:4px; }
.tune { margin:0 0 8px 28px; padding:10px 12px; border-radius:8px; background:var(--card); }
.tune.off { opacity:.45; }
.slider { display:grid; grid-template-columns:150px 1fr 44px; align-items:center; gap:10px; font-size:13px; }
.slider + .slider { margin-top:6px; }
.slider input { width:100%; margin:0; }
.slider output { text-align:right; font-variant-numeric:tabular-nums; }
/* The swatches sit on white, as they will in most editors, in either theme. */
.preview { margin-top:10px; padding:10px 12px; border-radius:6px; background:#fff; color:#1f2328; border:1px solid var(--line); font-size:14px; line-height:2; }
.preview span { padding:1px 5px; border-radius:4px; }
.preview .mono { font-family:Menlo,Consolas,monospace; font-size:13px; }
#status { color:#1a7f37; font-weight:500; opacity:0; transition:opacity .2s; }
#status.shown { opacity:1; }
.links { margin-left:auto; }
a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1><img src="icons/icon-48.png" alt=""><span data-i18n="optTitle">Boksa settings</span></h1>

  <fieldset>
    <legend data-i18n="optTarget">Paste target</legend>
    <label><input type="radio" name="target" value="generic"><span class="name" data-i18n="optTargetGeneric">Any editor</span><span class="hint" data-i18n="optTargetGenericHint"></span></label>
    <label><input type="radio" name="target" value="salesforce"><span class="name" data-i18n="optTargetSalesforce">Salesforce</span><span class="hint" data-i18n="optTargetSalesforceHint"></span></label>
    <label><input type="radio" name="target" value="portal"><span class="name" data-i18n="optTargetPortal">Salesforce + Customer Portal</span><span class="hint" data-i18n="optTargetPortalHint"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="optBackgrounds">Backgrounds</legend>
    <label><input type="radio" name="backgrounds" value="all"><span class="name" data-i18n="optBgAll">Keep all</span><span class="hint" data-i18n="optBgAllHint"></span></label>
    <label><input type="radio" name="backgrounds" value="code"><span class="name" data-i18n="optBgCode">Code only</span><span class="hint" data-i18n="optBgCodeHint"></span></label>
    <label><input type="radio" name="backgrounds" value="none"><span class="name" data-i18n="optBgNone">None</span><span class="hint" data-i18n="optBgNoneHint"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="optTextBg">Behind text</legend>
    <label><input type="radio" name="textBackgrounds" value="keep"><span class="name" data-i18n="optTextBgKeep">Keep</span><span class="hint" data-i18n="optTextBgKeepHint"></span></label>
    <label><input type="radio" name="textBackgrounds" value="soft"><span class="name" data-i18n="optTextBgSoft">Soften</span><span class="hint" data-i18n="optTextBgSoftHint"></span></label>
    <div class="tune" id="tune">
      <div class="slider"><span data-i18n="optSoftLighten">Lighten toward white</span><input type="range" name="softLighten" min="0" max="100" step="1"><output for="softLighten"></output></div>
      <div class="slider"><span data-i18n="optSoftSaturation">Keep saturation</span><input type="range" name="softSaturation" min="0" max="100" step="1"><output for="softSaturation"></output></div>
      <div class="preview" id="preview" aria-hidden="true"></div>
    </div>
    <label><input type="radio" name="textBackgrounds" value="none"><span class="name" data-i18n="optTextBgNone">Remove</span><span class="hint" data-i18n="optTextBgNoneHint"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="optCode">Code blocks</legend>
    <label><input type="radio" name="codeBlocks" value="standard"><span class="name" data-i18n="optCodeStandard">Standard</span><span class="hint" data-i18n="optCodeStandardHint"></span></label>
    <label><input type="radio" name="codeBlocks" value="robust"><span class="name" data-i18n="optCodeRobust">Editor-safe</span><span class="hint" data-i18n="optCodeRobustHint"></span></label>
    <label><input type="checkbox" name="highlight"><span class="name" data-i18n="optHighlight">Keep syntax highlighting</span><span class="hint" data-i18n="optHighlightHint"></span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="optFonts">Fonts</legend>
    <label><input type="radio" name="fonts" value="page"><span class="name" data-i18n="optFontsPage">Page fonts</span><span class="hint" data-i18n="optFontsPageHint"></span></label>
    <label><input type="radio" name="fonts" value="editor"><span class="name" data-i18n="optFontsEditor">Editor font</span><span class="hint" data-i18n="optFontsEditorHint"></span></label>
  </fieldset>

  <footer>
    <button type="button" id="shortcuts" data-i18n="optShortcuts">Change keyboard shortcuts</button>
    <button type="button" id="reset" data-i18n="optReset">Restore defaults</button>
    <span id="status" role="status" data-i18n="optSaved">Saved</span>
    <a class="links" href="https://baramsoft.com/support/" target="_blank" rel="noopener" data-i18n="optSupport">Help &amp; support</a>
  </footer>
</main>
<script src="color.js"></script>
<script src="options.js"></script>
</body>
</html>
